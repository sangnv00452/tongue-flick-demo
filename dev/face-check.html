<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Face check</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 14px system-ui, sans-serif; display: flex; gap: 12px; padding: 12px; flex-wrap: wrap; }
      canvas { max-width: 48vw; height: auto; }
      pre { width: 100%; }
    </style>
  </head>
  <body>
    <canvas id="a"></canvas>
    <canvas id="b"></canvas>
    <pre id="out">running…</pre>
    <script type="module">
      // Dev check (open with ?img=<face photo URL>): runs the real Face Landmarker on a portrait, then measures the tongue region
      // as-is (tongue in) and with a tongue-coloured shape painted over the lower lip (tongue out).
      import { createTongueTracker, LM } from '../src/tongue-signal.js';
      const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';
      const { FaceLandmarker, FilesetResolver } = await import(`${MP}/vision_bundle.mjs`);
      const lm = await FaceLandmarker.createFromOptions(await FilesetResolver.forVisionTasks(`${MP}/wasm`), {
        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' },
        runningMode: 'IMAGE',
        numFaces: 1,
      });
      const img = new Image();
      img.crossOrigin = 'anonymous';
      const src = new URLSearchParams(location.search).get('img');
      if (!src) throw new Error('pass ?img=<CORS-enabled face photo URL>');
      img.src = src;
      await img.decode();

      function run(canvas, withTongue, tracker) {
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const g = canvas.getContext('2d', { willReadFrequently: true });
        g.drawImage(img, 0, 0);
        const first = lm.detect(canvas).faceLandmarks[0];
        if (!first) return { face: false };
        const pts = first.map((p) => ({ x: p.x * canvas.width, y: p.y * canvas.height }));
        if (withTongue) {
          // A tongue hanging over the lower lip toward the chin.
          const lip = pts[LM.lowerOuter];
          const chin = pts[LM.chin];
          const w = Math.hypot(pts[LM.eyeOuterL].x - pts[LM.eyeOuterR].x, pts[LM.eyeOuterL].y - pts[LM.eyeOuterR].y);
          g.fillStyle = 'rgb(214,92,110)';
          g.beginPath();
          g.ellipse(lip.x, (lip.y + chin.y) / 2 - (chin.y - lip.y) * 0.1, w * 0.17, (chin.y - lip.y) * 0.45, 0, 0, Math.PI * 2);
          g.fill();
        }
        const data = g.getImageData(0, 0, canvas.width, canvas.height).data;
        const sample = (x, y) => {
          const i = (Math.min(canvas.height - 1, Math.max(0, Math.round(y))) * canvas.width + Math.min(canvas.width - 1, Math.max(0, Math.round(x)))) * 4;
          return [data[i], data[i + 1], data[i + 2]];
        };
        if (!withTongue) for (let i = 0; i < 5; i++) tracker.calibrate(pts);
        const m = tracker.measure(pts, sample);

        g.fillStyle = 'rgba(120,230,255,0.8)';
        for (const p of pts) g.fillRect(p.x - 1, p.y - 1, 2, 2);
        g.strokeStyle = '#fff';
        g.beginPath();
        for (const { start, end } of FaceLandmarker.FACE_LANDMARKS_LIPS) {
          g.moveTo(pts[start].x, pts[start].y);
          g.lineTo(pts[end].x, pts[end].y);
        }
        g.stroke();
        g.strokeStyle = '#ff3c78';
        g.lineWidth = 2;
        g.beginPath();
        m.region.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)));
        g.closePath();
        g.stroke();
        for (const s of m.samples) {
          g.fillStyle = { tongue: '#ff3c78', skin: '#fff', shadow: '#8a8fa3', dark: '#555' }[s.kind];
          g.beginPath();
          g.arc(s.x, s.y, 3, 0, Math.PI * 2);
          g.fill();
        }
        for (const i of [LM.cheekR, LM.cheekL, LM.lowerOuter, LM.chin]) {
          g.fillStyle = '#ffd166';
          g.fillRect(pts[i].x - 4, pts[i].y - 4, 8, 8);
        }
        const kinds = m.samples.reduce((a, s) => ({ ...a, [s.kind]: (a[s.kind] || 0) + 1 }), {});
        return { face: true, extension: m.extension, kinds };
      }

      const tracker = createTongueTracker();
      const inResult = run(document.getElementById('a'), false, tracker);
      const outResult = run(document.getElementById('b'), true, tracker);
      window.__faceCheck = { in: inResult, out: outResult };
      document.getElementById('out').textContent = JSON.stringify(window.__faceCheck, null, 1);
    </script>
  </body>
</html>
